<svg viewBox="0 0 340 190" width="100%" xmlns="http://www.w3.org/2000/svg"><rect x="111" y="5" width="118" height="39" rx="9" fill="#64748b" fill-opacity=".14" stroke="#64748b" /><text x="170" y="22" font-size="13" text-anchor="middle" fill="currentColor" font-weight="bold">匿名の客</text><text x="170" y="36" font-size="10" text-anchor="middle" fill="currentColor">証明書を取得・提示</text><path d="M145 44 L85 82 M195 44 L255 82" stroke="#64748b" stroke-width="1.7" fill="none" /><rect x="8" y="82" width="146" height="72" rx="10" fill="#0d9488" fill-opacity=".12" stroke="#0d9488" /><text x="81" y="103" text-anchor="middle" font-size="14" font-weight="bold" fill="currentColor">興信所</text><text x="81" y="120" text-anchor="middle" font-size="11" fill="currentColor">経歴・現状を評価</text><text x="81" y="136" text-anchor="middle" font-size="10" fill="currentColor">資金の使途は知らない</text><rect x="186" y="82" width="146" height="72" rx="10" fill="#2563eb" fill-opacity=".12" stroke="#2563eb" /><text x="259" y="103" text-anchor="middle" font-size="14" font-weight="bold" fill="currentColor">銀行</text><text x="259" y="120" text-anchor="middle" font-size="11" fill="currentColor">証明書で融資判断</text><text x="259" y="136" text-anchor="middle" font-size="10" fill="currentColor">客の氏名は知らない</text><path d="M154 119 H186" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3" /><text x="170" y="112" font-size="9" text-anchor="middle" fill="currentColor">署名</text><text x="170" y="178" font-size="11" text-anchor="middle" fill="currentColor">信用情報と商取引情報を束ねない</text></svg>
