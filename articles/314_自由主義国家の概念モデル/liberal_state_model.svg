<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#728DA0"/></marker></defs><style>text{font-family:"Noto Sans CJK JP","Noto Sans",sans-serif}</style><rect x="0" y="0" width="1800" height="1120" rx="0" fill="#F7FAFC" stroke="#F7FAFC" stroke-width="0"/><text x="900" y="66" text-anchor="middle" font-size="48" font-weight="800" fill="#12334A">自由主義国家の概念モデル</text><text x="900" y="112" text-anchor="middle" font-size="24" font-weight="500" fill="#547084">国家は規律を設計する。国民は施策を選ぶ。仕事は資格者が請け負う。</text><rect x="210" y="145" width="1380" height="100" rx="24" fill="#DDF4E9" stroke="#8AD2B3" stroke-width="2"/><text x="900" y="187" text-anchor="middle" font-size="31" font-weight="750" fill="#125844">基本理念｜自由主義＝個人への制約を減らそうとすること</text><text x="900" y="226" text-anchor="middle" font-size="22" font-weight="500" fill="#225F51">国家の責務：全国一律にせざるを得ない規律を研究・開発・運用・評価・改良する</text><rect x="65" y="305" width="510" height="245" rx="22" fill="#E8F1FF" stroke="#9FBDEB" stroke-width="2"/><text x="320" y="354" text-anchor="middle" font-size="35" font-weight="750" fill="#164C8A">提案｜誰でも</text><text x="320" y="405" text-anchor="middle" font-size="24" font-weight="500" fill="#183247">国籍・年齢・所属を問わない</text><text x="320" y="448" text-anchor="middle" font-size="24" font-weight="500" fill="#183247">施策の新設・改良・廃止を提案</text><text x="320" y="501" text-anchor="middle" font-size="21" font-weight="500" fill="#365B77">政策決定権の包括的代理は置かない</text><rect x="645" y="305" width="510" height="245" rx="22" fill="#FFF0D8" stroke="#E8C388" stroke-width="2"/><text x="900" y="354" text-anchor="middle" font-size="34" font-weight="750" fill="#865212">施策ごとの選択・評価</text><text x="900" y="405" text-anchor="middle" font-size="25" font-weight="500" fill="#183247">18歳以上の国民が直接行う</text><text x="900" y="448" text-anchor="middle" font-size="24" font-weight="500" fill="#183247">施策を個別に選び、結果を評価</text><text x="900" y="501" text-anchor="middle" font-size="22" font-weight="500" fill="#755B3B">提案・選択・評価を分離</text><rect x="1225" y="305" width="510" height="245" rx="22" fill="#F2E9FF" stroke="#C9ADEB" stroke-width="2"/><text x="1480" y="354" text-anchor="middle" font-size="35" font-weight="750" fill="#673A95">投票権の市場</text><text x="1480" y="405" text-anchor="middle" font-size="22" font-weight="500" fill="#183247">施策ごとに成人国民へ1票を初期配分</text><text x="1480" y="448" text-anchor="middle" font-size="23" font-weight="500" fill="#183247">自由に売買・譲渡／所有者が行使</text><text x="1480" y="501" text-anchor="middle" font-size="23" font-weight="500" fill="#674E80">当該投票終了時に消滅</text><path d="M575,427 L638,427" fill="none" stroke="#728DA0" stroke-width="3"  marker-end="url(#arrow)"/><path d="M1225,427 L1162,427" fill="none" stroke="#728DA0" stroke-width="3"  marker-end="url(#arrow)"/><rect x="560" y="625" width="680" height="120" rx="24" fill="#FFFFFF" stroke="#7EABB7" stroke-width="3"/><text x="900" y="676" text-anchor="middle" font-size="40" font-weight="800" fill="#17495C">個々の施策</text><text x="900" y="718" text-anchor="middle" font-size="23" font-weight="500" fill="#476575">全国一律である必要性を施策ごとに問う</text><path d="M900,551 L900,617" fill="none" stroke="#728DA0" stroke-width="3"  marker-end="url(#arrow)"/><rect x="95" y="827" width="750" height="170" rx="22" fill="#E7F7F3" stroke="#9CCFC3" stroke-width="2"/><text x="470" y="875" text-anchor="middle" font-size="35" font-weight="750" fill="#146B5C">有資格者プール</text><text x="470" y="922" text-anchor="middle" font-size="23" font-weight="500" fill="#183247">大量の有資格者が、能力を継続的に備える</text><text x="470" y="962" text-anchor="middle" font-size="22" font-weight="500" fill="#183247">行政・司法の専門能力を特定組織に固定しない</text><rect x="955" y="827" width="750" height="170" rx="22" fill="#E8F1FF" stroke="#A5BEDB" stroke-width="2"/><text x="1330" y="875" text-anchor="middle" font-size="32" font-weight="750" fill="#1C5685">オン・デマンド＆アド・ホック</text><text x="1330" y="922" text-anchor="middle" font-size="24" font-weight="500" fill="#183247">必要な案件に応じて実行組織を編成</text><text x="1330" y="962" text-anchor="middle" font-size="23" font-weight="500" fill="#183247">案件終了後に解散／実績を評価</text><path d="M900,747 L900,785" fill="none" stroke="#728DA0" stroke-width="3"  marker-end="url(#arrow)"/><path d="M900,785 L1330,785" fill="none" stroke="#728DA0" stroke-width="3"  marker-end="url(#arrow)"/><path d="M1330,785 L1330,820" fill="none" stroke="#728DA0" stroke-width="3"  marker-end="url(#arrow)"/><path d="M845,913 L946,913" fill="none" stroke="#728DA0" stroke-width="3"  marker-end="url(#arrow)"/><rect x="95" y="1030" width="1610" height="64" rx="15" fill="#E9EEF1" stroke="#D2DDE4" stroke-width="2"/><text x="900" y="1072" text-anchor="middle" font-size="25" font-weight="650" fill="#365567">設計原則｜禁止・強制を減らし、可能なら物理・論理的な仕組みで問題の発生を防ぐ</text></svg>